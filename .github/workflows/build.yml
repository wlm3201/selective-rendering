name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle/mod.gradle 用 Java 25 编译，构建机必须提供同版本 JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 包装脚本是在 Windows 上提交的，可能没有可执行位
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Read version
        id: version
        run: echo "value=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      # 根项目收集了所有 MC 版本的产物；-dev / -sources 是开发用的中间产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selective-rendering-${{ steps.version.outputs.value }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources*.jar
          if-no-files-found: error