name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The wrapper is committed, but the executable bit is not always kept by a checkout.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # No -PconfigScreen, so Fabric API, Mod Menu and YACL stay off the runtime classpath and
      # the jar that comes out is the one that gets released. The config screen still compiles,
      # being compile only.
      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: selective-rendering
          path: build/libs/*.jar
          if-no-files-found: error
