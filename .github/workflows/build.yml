name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The wrapper is committed, but the executable bit is not always kept by a checkout.
      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      # No -PconfigScreen, so Fabric API, Mod Menu and YACL stay off the runtime classpath and
      # the jars that come out are the ones that get released. The config screen still compiles,
      # being compile only. One run builds every supported game version.
      - name: Build
        run: ./gradlew build --stacktrace

      # Every version leaves its jars in its own directory, so the root build/libs is empty.
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: selective-rendering
          path: versions/*/build/libs/*.jar
          if-no-files-found: error
