name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle/mod.gradle 用 Java 25 编译，构建机必须提供同版本 JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"

      # 覆盖版本号，让 jar 名与 fabric.mod.json 和发布的 tag 一致
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace -Pversion=${{ steps.version.outputs.value }}

      # 只发布正式 jar：-dev 是未重映射的，-sources 是给开发者看的
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(ls build/libs/*.jar | grep -v -- '-dev\.jar$' | grep -v -- '-sources' || true)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber
          else
            gh release create "$TAG" $assets \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi